<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wiki</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/themes/prism.min.css">
<style>
:root {
  --bg: #ffffff;
  --sidebar-bg: #f5f6fa;
  --surface: #eef0f5;
  --border: #d0d4de;
  --text: #1a1a2e;
  --text-muted: #6b7280;
  --primary: #2563eb;
  --accent: #7c4dff;
  --hover: #e2e4eb;
  --font: 'Hiragino Sans', 'BIZ UDPGothic', sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
.app { display: flex; height: 100vh; }
.sidebar {
  width: 300px; min-width: 200px; resize: horizontal; overflow: auto;
  background: var(--sidebar-bg); border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
}
.sidebar-header {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  font-weight: bold; font-size: 15px;
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-header .btn-icon {
  background: none; border: none; color: var(--text-muted); cursor: pointer;
  font-size: 18px; padding: 2px 6px; border-radius: 4px;
}
.sidebar-header .btn-icon:hover { color: var(--text); background: var(--hover); }
.tree { flex: 1; overflow-y: auto; padding: 8px 0; }
.tree ul { list-style: none; padding-left: 18px; }
.tree > ul { padding-left: 0; }
.tree li { position: relative; }
.tree-item {
  display: flex; align-items: center; padding: 3px 12px 3px 8px;
  cursor: pointer; border-radius: 0; white-space: nowrap;
  user-select: none; min-height: 28px;
}
.tree-item:hover { background: var(--hover); }
.tree-item.active { background: var(--surface); color: var(--primary); }
.tree-item .icon { width: 18px; text-align: center; margin-right: 4px; flex-shrink: 0; }
.tree-item .name { overflow: hidden; text-overflow: ellipsis; }
.tree-item .chevron { width: 16px; text-align: center; flex-shrink: 0; font-size: 10px; color: var(--text-muted); transition: transform .15s; }
.tree-item .chevron.open { transform: rotate(90deg); }
.main {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
}
.toolbar {
  padding: 8px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: var(--sidebar-bg); flex-shrink: 0;
}
.toolbar .breadcrumb { flex: 1; font-size: 12px; color: var(--text-muted); }
.toolbar .breadcrumb span { color: var(--text); }
.toolbar button {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 4px 12px; border-radius: 4px;
  cursor: pointer; font-size: 12px;
}
.toolbar button:hover { background: var(--hover); }
.content-area { flex: 1; overflow-y: auto; padding: 24px 32px; }
.content-area.markdown {
  line-height: 1.8; max-width: 900px; margin: 0 auto;
}
.content-area.markdown h1 { font-size: 1.8em; margin: 0 0 16px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
.content-area.markdown h2 { font-size: 1.4em; margin: 24px 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.content-area.markdown h3 { font-size: 1.2em; margin: 20px 0 8px; }
.content-area.markdown p { margin: 0 0 12px; }
.content-area.markdown code {
  background: var(--surface); padding: 2px 6px; border-radius: 3px;
  font-size: 0.9em;
}
.content-area.markdown pre { margin: 16px 0; border-radius: 6px; overflow-x: auto; }
.content-area.markdown pre code { background: none; padding: 0; }
.content-area.markdown blockquote {
  border-left: 3px solid var(--primary); padding: 8px 16px;
  margin: 16px 0; background: var(--surface); border-radius: 0 4px 4px 0;
}
.content-area.markdown ul, .content-area.markdown ol { padding-left: 24px; margin: 8px 0; }
.content-area.markdown li { margin: 4px 0; }
.content-area.markdown img { max-width: 100%; border-radius: 6px; margin: 16px 0; }
.content-area.markdown table {
  width: 100%; border-collapse: collapse; margin: 16px 0;
}
.content-area.markdown th, .content-area.markdown td {
  border: 1px solid var(--border); padding: 8px 12px; text-align: left;
}
.content-area.markdown th { background: var(--surface); }
.content-area.markdown hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
.mermaid-wrapper { text-align: center; margin: 16px 0; }
.mermaid-wrapper svg { max-width: 100%; height: auto; }
.csv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.csv-table th, .csv-table td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; white-space: nowrap; }
.csv-table th { background: var(--surface); position: sticky; top: 0; z-index: 1; font-weight: 600; }
.csv-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.csv-table tr:hover { background: var(--hover); }
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; color: var(--text-muted);
}
.empty-state h2 { font-size: 1.5em; margin-bottom: 8px; }
.empty-state p { font-size: 0.9em; }
.edit-pane { display: flex; height: 100%; }
.edit-pane textarea {
  flex: 1; background: #fafbfc; color: var(--text); border: none;
  padding: 16px; font-family: 'Consolas', 'Monaco', monospace;
  font-size: 13px; line-height: 1.6; resize: none; outline: none;
}
.edit-pane .preview {
  flex: 1; overflow-y: auto; padding: 16px 24px;
  border-left: 1px solid var(--border);
}
.image-view { display: flex; align-items: center; justify-content: center; height: 100%; }
.image-view img { max-width: 90%; max-height: 90vh; object-fit: contain; }
.text-view { white-space: pre-wrap; font-family: 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.6; }
.context-menu {
  position: fixed; background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 0; min-width: 160px;
  z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,.4);
}
.context-menu div {
  padding: 6px 16px; cursor: pointer; font-size: 13px;
}
.context-menu div:hover { background: var(--hover); color: var(--primary); }
.context-menu .sep {
  border-top: 1px solid var(--border); margin: 4px 0; padding: 0;
}
.hidden { display: none !important; }
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface); border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 6px; font-size: 13px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 9999;
  opacity: 0; transition: opacity .3s;
}
.toast.show { opacity: 1; }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center; z-index: 1001;
}
.modal-dialog-sm {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  min-width: 360px; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.modal-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 15px; }
.modal-body { padding: 12px 16px; }
.modal-footer { padding: 8px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
.mb-1 { margin-bottom: 8px; }
.form-control {
  width: 100%; padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg); color: var(--text);
  font-size: 13px; font-family: var(--font); box-sizing: border-box;
}
.form-control:focus { outline: none; border-color: var(--primary); }
.loading { text-align: center; padding: 48px; color: var(--text-muted); }
.root-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.85rem; }
.root-item-name { font-weight: 600; min-width: 60px; }
.root-item-path { color: var(--text-muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.root-item-status { font-size: 0.75rem; padding: 1px 6px; border-radius: 3px; }
.root-item-status.accessible { background: #d4edda; color: #155724; }
.root-item-status.inaccessible { background: #f8d7da; color: #721c24; }
.cool-indicator {
  cursor: pointer; font-size: 10px; font-weight: bold; padding: 1px 5px;
  border-radius: 3px; background: var(--surface); margin-left: 6px;
  user-select: none;
}
.cool-indicator:hover { background: var(--hover); }
.cool-panel {
  padding: 6px 12px 8px; border-bottom: 1px solid var(--border);
  background: var(--surface); font-size: 12px;
}
.cool-status { margin-bottom: 4px; }
.cool-actions { display: flex; gap: 4px; }
.cool-btn {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 2px 8px; border-radius: 3px;
  cursor: pointer; font-size: 11px;
}
.cool-btn:hover { background: var(--hover); }
.cool-btn:disabled { opacity: .5; cursor: default; }
.cool-doc-container { width: 100%; height: 100%; }
.cool-iframe { width: 100%; height: calc(100vh - 100px); border: none; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* --- Folder View (Bookmarks in main pane) --- */
.folder-view { padding: 24px 32px; }
.folder-view-header {
  font-size: 1.1em; color: var(--text-muted); padding-bottom: 8px;
  border-bottom: 1px solid var(--border); margin-bottom: 8px;
}
.fv-bookmarks-header {
  display: flex; align-items: center; justify-content: space-between;
  margin: 16px 0 8px;
}
.fv-bookmarks-header h2 { font-size: 1.1em; margin: 0; }
.fv-actions { display: flex; gap: 6px; }
.fv-btn {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text); padding: 3px 10px; border-radius: 4px;
  cursor: pointer; font-size: 12px;
}
.fv-btn:hover { background: var(--hover); }
.fv-bookmark-item {
  display: flex; align-items: center; padding: 6px 10px;
  border-radius: 6px; gap: 8px;
}
.fv-bookmark-item:hover { background: var(--surface); }
.fv-bookmark-item a {
  flex: 1; display: flex; align-items: center; gap: 8px;
  text-decoration: none; color: var(--text); min-width: 0;
}
.fv-bookmark-item a:hover { color: var(--primary); }
.fv-favicon { width: 16px; height: 16px; flex-shrink: 0; }
.fv-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-domain { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.fv-del-btn, .fv-edit-btn {
  background: none; border: none; cursor: pointer; font-size: 12px;
  padding: 2px 6px; border-radius: 4px; color: var(--text-muted);
}
.fv-del-btn:hover { color: #e53e3e; background: #fee; }
.fv-edit-btn:hover { color: var(--primary); background: var(--surface); }
.fv-list-thumb { width: 40px; height: 22px; object-fit: cover; border-radius: 3px; flex-shrink: 0; }
.fv-thumb-grid-sm { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
.fv-thumb-grid-md { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.fv-thumb-grid-lg { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.fv-thumb-grid {
  display: grid; gap: 12px; margin: 12px 0;
}
.fv-thumb-card {
  border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  position: relative;
}
.fv-thumb-card:hover { border-color: var(--primary); }
.fv-thumb-card a { text-decoration: none; color: var(--text); display: block; }
.fv-thumb-img {
  width: 100%; aspect-ratio: 120/68; object-fit: cover;
  background: var(--surface); display: block;
}
.fv-thumb-fallback {
  width: 100%; aspect-ratio: 120/68;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); font-size: 32px; color: var(--text-muted);
}
.fv-thumb-info { padding: 8px 10px; }
.fv-thumb-info .fv-title { font-size: 13px; }
.fv-thumb-info .fv-domain { font-size: 11px; }
.fv-thumb-card .fv-del-btn, .fv-thumb-card .fv-edit-btn {
  position: absolute; top: 4px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 50%; width: 22px; height: 22px; padding: 0;
  display: flex; align-items: center; justify-content: center; font-size: 11px;
}
.fv-thumb-card .fv-del-btn { right: 4px; }
.fv-thumb-card .fv-edit-btn { right: 26px; }
.fv-files-header {
  font-size: 13px; color: var(--text-muted); margin: 12px 0 4px; font-weight: bold;
}
.fv-file-list { margin: 0 0 4px; }
.fv-file-item {
  display: flex; align-items: center; padding: 3px 8px; border-radius: 4px;
  cursor: pointer; font-size: 13px; gap: 6px;
}
.fv-file-item:hover { background: var(--surface); }
.fv-file-icon { flex-shrink: 0; width: 18px; text-align: center; }
.fv-file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fv-file-suffix { color: var(--text-muted); font-size: 12px; }
.fv-empty {
  text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 14px;
}
.fv-dropzone {
  border: 2px dashed var(--border); border-radius: 8px;
  padding: 24px; text-align: center; margin: 16px 0;
  color: var(--text-muted); font-size: 14px; transition: all .2s;
}
.content-area.fv-dragover { outline: 3px dashed var(--primary); outline-offset: -4px; background: rgba(37,99,235,.03); }
/* Inline bookmark list in markdown content */
.bookmark-list-inline { margin: 16px 0; }
.bookmark-item-inline {
  display: flex; align-items: center; padding: 4px 8px;
  border-radius: 4px; font-size: 13px;
}
.bookmark-item-inline:hover { background: var(--surface); }
.bookmark-item-inline a {
  flex: 1; display: flex; align-items: center; gap: 6px;
  color: var(--text); text-decoration: none; min-width: 0;
}
.bookmark-item-inline a:hover { color: var(--primary); }
.bookmark-favicon-inline { width: 16px; height: 16px; flex-shrink: 0; }
.bookmark-title-inline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bookmark-domain-inline {
  font-size: 11px; color: var(--text-muted); flex-shrink: 0;
  margin-left: auto; padding-left: 8px;
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span>Wiki</span>
      <span id="coolIndicator" class="cool-indicator" title="Collabora Online" onclick="toggleCoolPanel()">CO</span>
      <div>
        <button class="btn-icon" onclick="showRootDialog()" title="ルート設定">&#x2699;</button>
        <button class="btn-icon" onclick="refreshTree()" title="更新">&#x21bb;</button>
        <button class="btn-icon" onclick="createFile()" title="新規ファイル">+</button>
      </div>
    </div>
    <div id="coolPanel" class="cool-panel hidden">
      <div class="cool-status" id="coolStatusText">&#x25cf; 確認中...</div>
      <div class="cool-actions">
        <button class="cool-btn" id="coolStartBtn" onclick="coolAction('start')">&#x25b6; 起動</button>
        <button class="cool-btn" id="coolStopBtn" onclick="coolAction('stop')">&#x25a0; 停止</button>
        <button class="cool-btn" onclick="coolRefresh()">&#x21bb;</button>
        <button class="cool-btn" onclick="window.open(COOL_HOST + '/browser/dist/admin/admin.html', '_blank')">&#x2699; 管理</button>
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </aside>
  <div class="main">
    <div class="toolbar" id="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <button id="bookmarkBtn" class="hidden" onclick="toggleBookmarkView()">&#x1f516;</button>
      <button id="viewToggleBtn" class="hidden" onclick="toggleFvView()">&#x2630;</button>
      <button id="editBtn" class="hidden" onclick="toggleEdit()">&#x270e; 編集</button>
      <button id="saveBtn" class="hidden" onclick="saveFile()">&#x1f4be; 保存</button>
      <button id="cancelBtn" class="hidden" onclick="cancelEdit()">&#x2716; 戻す</button>
      <button id="deleteBtn" class="hidden" onclick="deleteFile()">&#x1f5d1; 削除</button>
    </div>
    <div class="content-area" id="content"></div>
  </div>
</div>
<div class="context-menu hidden" id="contextMenu"></div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.6.0/mermaid.min.js"></script>
<script>
const API = '/api/knowledge';
const HOST = location.hostname;
const COOL_HOST = 'http://' + HOST + ':9980';
const COOL_BROWSER = COOL_HOST + '/browser/de013a57f9/cool.html';
const WOPI_HOST = 'http://' + HOST + ':8888';
const OFFICE_EXTS = ['doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp','rtf','csv'];

let state = { tree: [], currentPath: null, currentFolder: null, currentType: null, editMode: false, originalContent: false };
let selectedLi = null;
let suppressPopstate = false;

const $ = id => document.getElementById(id);

const toast = (msg) => {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
};

// root management
let rootDialogRoots = [];
let newRootName = '';
let newRootPath = '';
let rootManaging = false;
let rootError = '';

async function loadRootList() {
  try {
    const res = await fetch('/api/knowledge/roots');
    const data = await res.json();
    rootDialogRoots = data.roots || [];
  } catch {}
}

function showRootDialog() {
  loadRootList();
  newRootName = '';
  newRootPath = '';
  rootError = '';
  rootManaging = false;
  const div = document.createElement('div');
  div.id = 'rootDialog';
  div.className = 'modal-overlay';
  div.innerHTML = `<div class="modal-dialog-sm" id="rootDialogInner">
    <div class="modal-header">ルート設定</div>
    <div class="modal-body" id="rootDialogBody">
      <div id="rootList"></div>
      <hr>
      <input class="form-control mb-1" id="newRootName" placeholder="ルート名 (例: wiki)">
      <input class="form-control mb-1" id="newRootPath" placeholder="パス (例: /path/to/dir)">
      <div id="rootError" class="text-danger small" style="display:none"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm btn-primary" id="addRootBtn">追加</button>
      <button class="btn btn-sm btn-outline-secondary" id="closeRootBtn">閉じる</button>
    </div>
  </div>`;
  document.body.appendChild(div);

  const renderList = () => {
    const list = div.querySelector('#rootList');
    list.innerHTML = rootDialogRoots.map(r =>
      `<div class="root-item">
        <span class="root-item-name">${r.name}</span>
        <span class="root-item-path">${r.path}</span>
        <span class="root-item-status ${r.accessible ? 'accessible' : 'inaccessible'}">${r.accessible ? 'OK' : 'NG'}</span>
        ${!r.builtin ? '<button class="btn btn-sm btn-outline-danger root-del-btn" data-name="' + r.name + '">削除</button>' : ''}
      </div>`
    ).join('');
    list.querySelectorAll('.root-del-btn').forEach(btn => {
      btn.onclick = async () => {
        const name = btn.dataset.name;
        try {
          const res = await fetch('/api/knowledge/roots/' + encodeURIComponent(name), { method: 'DELETE' });
          if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
          const data = await res.json();
          rootDialogRoots = data.roots;
          renderList();
          refreshTree();
        } catch (e) { alert('削除失敗: ' + e.message); }
      };
    });
  };
  renderList();

  div.querySelector('#addRootBtn').onclick = async () => {
    const name = div.querySelector('#newRootName').value.trim();
    const path = div.querySelector('#newRootPath').value.trim();
    if (!name || !path) return;
    rootManaging = true;
    div.querySelector('#addRootBtn').disabled = true;
    div.querySelector('#rootError').style.display = 'none';
    try {
      const res = await fetch('/api/knowledge/roots', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, path }),
      });
      if (!res.ok) { const d = await res.json(); throw new Error(d.error); }
      const data = await res.json();
      rootDialogRoots = data.roots;
      div.querySelector('#newRootName').value = '';
      div.querySelector('#newRootPath').value = '';
      renderList();
      refreshTree();
    } catch (e) {
      const errEl = div.querySelector('#rootError');
      errEl.textContent = e.message;
      errEl.style.display = '';
    } finally {
      rootManaging = false;
      div.querySelector('#addRootBtn').disabled = false;
    }
  };

  div.onclick = (e) => { if (e.target === div) div.remove(); };
  div.querySelector('#closeRootBtn').onclick = () => div.remove();
  div.querySelector('#rootDialogInner').onclick = (e) => e.stopPropagation();
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  if (!res.ok) { const err = await res.json().catch(() => ({ error: res.statusText })); throw new Error(err.error || res.statusText); }
  return res.json();
}

function escapeHtml(s) {
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function renderCsvTable(csvText) {
  const rows = csvText.split('\n').filter(r => r.trim());
  if (!rows.length) return '<div class="empty-state"><p>空のCSV</p></div>';
  const headers = parseCsvRow(rows[0]);
  let html = '<div style="overflow-x:auto;max-height:100%;"><table class="csv-table"><thead><tr>';
  for (const h of headers) html += '<th>' + escapeHtml(h) + '</th>';
  html += '</tr></thead><tbody>';
  for (let i = 1; i < rows.length; i++) {
    const cols = parseCsvRow(rows[i]);
    html += '<tr>';
    for (let j = 0; j < cols.length; j++) {
      const val = cols[j];
      const isNum = /^[\d,]+(\.[\d]+)?$/.test(val) && !isNaN(parseFloat(val.replace(/,/g, '')));
      html += '<td' + (isNum ? ' class="num"' : '') + '>' + escapeHtml(val) + '</td>';
    }
    for (let j = cols.length; j < headers.length; j++) html += '<td></td>';
    html += '</tr>';
  }
  return html + '</tbody></table></div>';
}

function parseCsvRow(row) {
  const result = [];
  let cur = '', inQuote = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (inQuote) {
      if (c === '"') {
        if (i + 1 < row.length && row[i + 1] === '"') { cur += '"'; i++; }
        else inQuote = false;
      } else cur += c;
    } else {
      if (c === '"') inQuote = true;
      else if (c === ',') { result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function getFileUrl(path) {
  if (path && state.tree) {
    for (var i = 0; i < state.tree.length; i++) {
      var root = state.tree[i].path;
      if (!root) continue;
      if (path === root) {
        path = i === 0 ? '' : path;  // first root → /knowledge/, others keep name
        break;
      }
      if (path.indexOf(root + '/') === 0) {
        path = path.slice(root.length + 1);
        break;
      }
    }
  }
  return '/knowledge/' + (path || '');
}

function getPathFromUrl() {
  const p = window.location.pathname;
  if (p.startsWith('/knowledge/')) return decodeURIComponent(p.slice('/knowledge/'.length));
  return null;
}

function updateUrl(path, replace) {
  var url = path ? getFileUrl(path) : '/knowledge/';
  if (path && !path.includes('.') && !url.endsWith('/')) url += '/';  // trailing slash for dirs
  if (replace) {
    history.replaceState({ path }, '', url);
  } else {
    history.pushState({ path }, '', url);
  }
  document.title = path ? path.split('/').pop() + ' - Wiki' : 'Wiki';
}

function findTreeNode(path, nodes) {
  for (const n of nodes) {
    if (n.path === path) return n;
    if (n.children) {
      const found = findTreeNode(path, n.children);
      if (found) return found;
    }
  }
  return null;
}

function findTreeElement(path) {
  const items = document.querySelectorAll('.tree-item');
  for (const item of items) {
    if (item.dataset.path === path) return item;
  }
  return null;
}

const expandedCache = {};

async function revealInTree(path) {
  const parts = path.split('/');
  for (let i = 1; i < parts.length; i++) {
    const dir = parts.slice(0, i).join('/');
    await expandDir(dir);
  }
}

async function expandDir(dirPath) {
  const item = findTreeElement(dirPath);
  if (!item) return;
  const li = item.closest('li');
  if (!li) return;
  const ul = li.querySelector('ul');
  const chevron = item.querySelector('.chevron');
  if (!ul) return;
  if (!expandedCache[dirPath]) {
    expandedCache[dirPath] = true;
    try {
      const data = await fetch(API + '/tree?path=' + encodeURIComponent(dirPath));
      if (data.ok) {
        const json = await data.json();
        ul.innerHTML = '';
        buildTreeNodes(json.children || [], ul);
      }
    } catch {}
  }
  ul.style.display = '';
  if (chevron) chevron.classList.add('open');
}

async function refreshTree() {
  try {
    const data = await apiFetch('');
    state.tree = data.tree;
    renderTree();
    return data.tree;
  } catch (e) { toast('更新エラー: ' + e.message); }
}

function renderTree() {
  const ul = document.createElement('ul');
  buildTreeNodes(state.tree, ul);
  const tree = $('tree');
  tree.innerHTML = '';
  tree.appendChild(ul);
}

function buildTreeNodes(nodes, ul) {
  for (const node of nodes) {
    const li = document.createElement('li');
    const div = document.createElement('div');
    div.className = 'tree-item';
    div.dataset.path = node.path;

    if (node.type === 'directory') {
      const chevron = document.createElement('span');
      chevron.className = 'chevron';
      chevron.textContent = '\u25b6';
      div.appendChild(chevron);
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = '\ud83d\udcc1';
      div.appendChild(icon);
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = node.name;
      div.appendChild(name);

      div.onclick = (e) => { e.stopPropagation(); state.currentFolder = node.path; state.currentPath = node.path; state.currentType = 'directory';  if (selectedLi) selectedLi.classList.remove('active'); selectedLi = null; toggleDir(li, div); updateUrl(node.path); showFolderView(node.path); };
      div.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e, node); };

      const childUl = document.createElement('ul');
      childUl.style.display = 'none';
      li.appendChild(div);
      li.appendChild(childUl);
    } else {
      const icon = document.createElement('span');
      icon.className = 'icon';
      const ext = node.name.split('.').pop();
      if (['md', 'markdown'].includes(ext)) icon.textContent = '\ud83d\udcdd';
      else if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) icon.textContent = '\ud83d\uddbc';
      else if (['csv'].includes(ext)) icon.textContent = '\ud83d\udcca';
      else if (['json'].includes(ext)) icon.textContent = '\ud83d\udce6';
      else if (['doc','docx'].includes(ext)) icon.textContent = '\ud83d\udcdd';
      else if (['xls','xlsx'].includes(ext)) icon.textContent = '\ud83d\udcca';
      else if (['ppt','pptx'].includes(ext)) icon.textContent = '\ud83d\udcc4';
      else icon.textContent = '\ud83d\udcc4';
      div.appendChild(icon);
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = node.name;
      div.appendChild(name);

      div.onclick = () => selectFile(node.path, div, node.name);
      div.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e, node); };

      li.appendChild(div);
    }
    ul.appendChild(li);
  }
}

function toggleDir(li, div) {
  const ul = li.querySelector('ul');
  const chevron = div.querySelector('.chevron');
  if (!ul) return;
  const dirPath = div.dataset.path;
  if (ul.style.display === 'none') {
    expandDir(dirPath);
  } else {
    ul.style.display = 'none';
    if (chevron) chevron.classList.remove('open');
  }
}

async function selectFile(path, div, name) {
  state.editMode = false;
  state.currentPath = path;
  state.currentType = 'file';
  state.currentFolder = getFolderPath(path) || state.currentFolder;
  
  if (selectedLi) selectedLi.classList.remove('active');
  div.classList.add('active');
  selectedLi = div;
  updateUrl(path);
  await revealInTree(path);
  loadContent(path, name);
  checkBookmarks();
}

async function loadContent(path, name) {
  const content = $('content');
  const ext = path.split('.').pop().toLowerCase();

  const folder = getFolderPath(path);

  if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg', 'bmp', 'ico'].includes(ext)) {
    content.className = 'content-area image-view';
    content.innerHTML = `<img src="/api/knowledge/file/${path}" alt="${escapeHtml(name)}">`;
    showToolbar(path, 'image');
    checkBookmarks();
    return;
  }

  if (ext === 'md' || ext === 'markdown') {
    try {
      const data = await apiFetch('/content/' + path);
      content.className = 'content-area markdown';
      content.innerHTML = data.html;
      if (window.Prism) Prism.highlightAllUnder(content);
      renderMermaid(content);
      showToolbar(path, 'markdown');
      checkBookmarks();
    } catch (e) { content.innerHTML = `<div class="empty-state"><p>${escapeHtml(e.message)}</p></div>`; }
    return;
  }

  if (OFFICE_EXTS.includes(ext)) {
    const wopiUrl = WOPI_HOST + '/knowledge/wopi/files/' + path;
    const coolUrl = COOL_BROWSER + '?WOPISrc=' + encodeURIComponent(wopiUrl) + '&access_token=dev';
    content.className = 'content-area';
    content.innerHTML = `<div class="cool-doc-container">
      <iframe src="${escapeHtml(coolUrl)}" class="cool-iframe" allowfullscreen></iframe>
    </div>`;
    showToolbar(path, 'office');
    return;
  }

  try {
    const data = await apiFetch('/raw/' + path);
    if (ext === 'csv') {
      content.className = 'content-area';
      content.innerHTML = renderCsvTable(data.content);
    } else {
      content.className = 'content-area text-view';
      content.innerHTML = escapeHtml(data.content);
    }
    showToolbar(path, ext === 'csv' ? 'csv' : 'text');
    checkBookmarks();
  } catch (e) { content.innerHTML = `<div class="empty-state"><p>${escapeHtml(e.message)}</p></div>`; }
}

function showToolbar(path, type) {
  const editBtn = $('editBtn');
  const saveBtn = $('saveBtn');
  const cancelBtn = $('cancelBtn');
  const deleteBtn = $('deleteBtn');
  const bc = $('breadcrumb');

  const parts = path.split('/');
  bc.innerHTML = parts.map((p, i) => {
    if (i === parts.length - 1) return `<span>${escapeHtml(p)}</span>`;
    return `<a href="#" onclick="navigateToDir('${parts.slice(0, i + 1).join('/')}'); return false;">${escapeHtml(p)}</a> / `;
  }).join('');

  editBtn.classList.remove('hidden');
  deleteBtn.classList.remove('hidden');
  saveBtn.classList.add('hidden');
  cancelBtn.classList.add('hidden');
  $('viewToggleBtn').classList.add('hidden');

  if (type === 'image') editBtn.classList.add('hidden');
  if (type === 'office') {
    editBtn.classList.add('hidden');
    deleteBtn.classList.add('hidden');
  }
}

function navigateToDir(dirPath) {
  const item = findTreeElement(dirPath);
  if (item) {
    const li = item.closest('li');
    if (li) {
      const ul = li.querySelector('ul');
      if (ul) ul.style.display = '';
      const chevron = item.querySelector('.chevron');
      if (chevron) chevron.classList.add('open');
    }
  }
}

async function toggleEdit() {
  if (!state.currentPath || state.editMode) return;
  const ext = state.currentPath.split('.').pop().toLowerCase();
  if (!['md', 'markdown', 'txt', 'json', 'yaml', 'yml', 'csv'].includes(ext)) {
    toast('このファイルは編集できません');
    return;
  }
  try {
    const data = await apiFetch('/raw/' + state.currentPath);
    state.originalContent = data.content;
    state.editMode = true;

    $('editBtn').classList.add('hidden');
    $('saveBtn').classList.remove('hidden');
    $('cancelBtn').classList.remove('hidden');

    const content = $('content');
    content.className = 'content-area';
    content.innerHTML = `<div class="edit-pane">
      <textarea id="editor">${escapeHtml(data.content)}</textarea>
      <div class="preview markdown" id="livePreview"></div>
    </div>`;

    if (ext === 'md' || ext === 'markdown') {
      const textarea = $('editor');
      textarea.addEventListener('input', updateLivePreview);
      updateLivePreview();
    }
  } catch (e) { toast('読込エラー: ' + e.message); }
}

function updateLivePreview() {
  const textarea = $('editor');
  const preview = $('livePreview');
  if (!textarea || !preview) return;
  preview.innerHTML = textarea.value;
}

async function saveFile() {
  if (!state.currentPath || !state.editMode) return;
  const textarea = $('editor');
  if (!textarea) return;
  try {
    await apiFetch('/raw/' + state.currentPath, {
      method: 'PUT',
      body: JSON.stringify({ content: textarea.value }),
    });
    toast('保存しました');
    cancelEdit();
    loadContent(state.currentPath, state.currentPath.split('/').pop());
  } catch (e) { toast('保存エラー: ' + e.message); }
}

function cancelEdit() {
  state.editMode = false;
  $('editBtn').classList.remove('hidden');
  $('saveBtn').classList.add('hidden');
  $('cancelBtn').classList.add('hidden');
  if (state.currentPath) loadContent(state.currentPath, state.currentPath.split('/').pop());
}

async function deleteFile() {
  if (!state.currentPath) return;
  if (!confirm('本当に削除しますか？（.trash に移動します）')) return;
  try {
    await apiFetch('/raw/' + state.currentPath, { method: 'DELETE' });
    toast('削除しました');
    state.currentPath = null;
    state.editMode = false;
    $('content').innerHTML = `<div class="empty-state"><h2>Wiki</h2><p>ファイルを選択してください</p></div>`;
    $('toolbar').querySelectorAll('button').forEach(b => b.classList.add('hidden'));
    $('breadcrumb').innerHTML = '';
    refreshTree();
    updateUrl(null, true);
  } catch (e) { toast('削除エラー: ' + e.message); }
}

async function createFile() {
  const name = prompt('新しいファイル名（例: new-page.md）:');
  if (!name) return;
  const base = state.currentPath ? state.currentPath.split('/').slice(0, -1).join('/') : '';
  const fullPath = base ? base + '/' + name : name;
  try {
    await apiFetch('/create/' + fullPath, { method: 'POST' });
    toast('作成しました');
    refreshTree();
  } catch (e) { toast('作成エラー: ' + e.message); }
}

function showContextMenu(e, node) {
  e.preventDefault();
  const menu = $('contextMenu');
  menu.innerHTML = '';

  if (node.type === 'directory') {
    addMenuItem(menu, '\ud83d\udcc4 新規ファイル', () => {
      const name = prompt('ファイル名:');
      if (name) apiFetch('/create/' + node.path + '/' + name, { method: 'POST' }).then(() => { refreshTree(); toast('作成しました'); });
    });
  } else {
    addMenuItem(menu, '\ud83d\udc42 開く', () => {
      const item = findTreeElement(node.path);
      if (item) selectFile(node.path, item, node.name);
    });
    addMenuItem(menu, '\u270e 編集', () => {
      const item = findTreeElement(node.path);
      if (item) { selectFile(node.path, item, node.name); setTimeout(toggleEdit, 100); }
    });
    addMenuItem(menu, '\u2b07 ダウンロード', () => {
      window.open(API + '/file/' + node.path + '?dl=1', '_blank');
    });
    const ext = node.name.split('.').pop().toLowerCase();
    if (OFFICE_EXTS.includes(ext)) {
      addMenuItem(menu, '\ud83d\udcbb Collaboraで開く', () => {
        const item = findTreeElement(node.path);
        if (item) selectFile(node.path, item, node.name);
      });
    }
    addMenuItem(menu, null, null, true);
    addMenuItem(menu, '\u2702 削除', async () => {
      if (!confirm('削除しますか？')) return;
      try { await apiFetch('/raw/' + node.path, { method: 'DELETE' }); toast('削除しました'); refreshTree(); }
      catch (e) { toast('エラー: ' + e.message); }
    });
  }

  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.remove('hidden');

  const close = () => { menu.classList.add('hidden'); document.removeEventListener('click', close); };
  setTimeout(() => document.addEventListener('click', close), 10);
}

function addMenuItem(menu, label, action, isSep) {
  if (isSep) { const d = document.createElement('div'); d.className = 'sep'; menu.appendChild(d); return; }
  const d = document.createElement('div');
  d.textContent = label;
  d.onclick = (e) => { e.stopPropagation(); action(); $('contextMenu').classList.add('hidden'); };
  menu.appendChild(d);
}

async function navigateByPath(path) {
  if (!path) {
    state.currentPath = null;
    state.currentFolder = null;
    
    selectedLi = null;
    $('content').innerHTML = `<div class="empty-state"><h2>Wiki</h2><p>サイドバーからファイルを選択してください</p></div>`;
    $('toolbar').querySelectorAll('button').forEach(b => b.classList.add('hidden'));
    $('breadcrumb').innerHTML = '';
    return;
  }
  // Prepend root name if path doesn't start with one (for API calls)
  var fullPath = path;
  var firstSeg = path.split('/')[0];
  if (state.tree.length > 0 && !state.tree.some(function(n) { return n.path === firstSeg; })) {
    fullPath = state.tree[0].path + '/' + path;
  }
  await revealInTree(fullPath);
  var name = fullPath.split('/').pop();
  // Directory? (file paths have extensions in this wiki)
  if (!name.includes('.')) {
    state.currentPath = fullPath;
    state.currentFolder = fullPath;
    state.currentType = 'directory';
    
    if (selectedLi) selectedLi.classList.remove('active');
    selectedLi = null;
    updateUrl(path, true);
    showFolderView(fullPath);
    return;
  }
  var item = findTreeElement(fullPath);
  if (item) {
    selectFile(fullPath, item, name);
  } else {
    var node = findTreeNode(fullPath, state.tree);
    name = node ? node.name : name;
    state.editMode = false;
    state.currentPath = fullPath;
    state.currentFolder = getFolderPath(fullPath) || state.currentFolder;
    state.currentType = 'file';
    if (selectedLi) selectedLi.classList.remove('active');
    selectedLi = null;
    updateUrl(path, true);
    loadContent(fullPath, name);
  }
}

function renderMermaid(root) {
  const blocks = root?.querySelectorAll('.language-mermaid');
  if (!blocks?.length) return;
  if (typeof mermaid === 'undefined') return;
  mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
  let id = 1;
  blocks.forEach(block => {
    const pre = block.closest('pre');
    if (!pre) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'mermaid-wrapper';
    wrapper.innerHTML = '<em>Loading diagram...</em>';
    pre.parentNode.replaceChild(wrapper, pre);
    const raw = block.textContent.trim();
    const source = raw.replace(/(\d\/\d)"/g, '$1in');
    const seq = id++;
    mermaid.render('mermaid-' + seq, source).then(({ svg }) => {
      wrapper.innerHTML = svg;
    }).catch(err => {
      wrapper.innerHTML = '<pre style="color:#c00;background:#fee;padding:8px;border-radius:4px;font-size:12px">Mermaid render error: ' + escapeHtml(err.message || err) + '\n\n<strong>Source:</strong>\n' + escapeHtml(source) + '</pre>';
    });
  });
}

window.addEventListener('popstate', (e) => {
  const path = e.state ? e.state.path : null;
  navigateByPath(path);
});

const COOL_API = '/api/collabora';
let coolOpen = false;

function toggleCoolPanel() {
  const panel = $('coolPanel');
  coolOpen = !coolOpen;
  if (coolOpen) {
    panel.classList.remove('hidden');
    coolRefresh();
  } else {
    panel.classList.add('hidden');
  }
}

async function coolRefresh() {
  const text = $('coolStatusText');
  const startBtn = $('coolStartBtn');
  const stopBtn = $('coolStopBtn');
  try {
    const res = await fetch(COOL_API + '/status');
    const st = await res.json();
    const indicator = $('coolIndicator');
    if (!st.engine) {
      text.innerHTML = '&#x26a0; エンジンなし（Podman/Docker）';
      indicator.style.color = '#999';
      startBtn.disabled = true;
      stopBtn.disabled = true;
      return;
    }
    if (st.running) {
      text.innerHTML = `<span style="color:#22c55e">&#x25cf;</span> 起動中 (${st.engine}) &mdash; Port ${st.hostPort}`;
      indicator.style.color = '#22c55e';
      startBtn.disabled = true;
      stopBtn.disabled = false;
    } else {
      text.innerHTML = `<span style="color:#ef4444">&#x25cf;</span> 停止中 (${st.engine})`;
      indicator.style.color = '#ef4444';
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

async function coolAction(action) {
  const text = $('coolStatusText');
  text.innerHTML = '&#x25cf; 実行中...';
  try {
    const res = await fetch(COOL_API + '/' + action, { method: 'POST' });
    const result = await res.json();
    if (result.ok) {

    } else {
      toast('エラー: ' + (result.error || 'unknown'));

// --- Folder View (Bookmarks in main pane) ---
let fvViewMode = 'list';
let currentBookmarks = [];
let currentFolderTree = [];

function getFolderPath(filePath) {
  if (!filePath) return '';
  const idx = filePath.lastIndexOf('/');
  return idx === -1 ? '' : filePath.slice(0, idx);
}

async function showFolderView(folderPath) {
  state.currentPath = folderPath;
  state.currentFolder = folderPath;
  state.currentType = 'directory';
  var content = $('content');
  var bc = $('breadcrumb');
  var parts = folderPath.split('/');
  bc.innerHTML = parts.map(function(p, i) {
    if (i === parts.length - 1) return '<span>' + escapeHtml(p) + '</span>';
    return '<a href="#" onclick="navigateToDir(\'' + parts.slice(0,i+1).join('/') + '\'); return false;">' + escapeHtml(p) + '</a> / ';
  }).join('');
  $('editBtn').classList.add('hidden');
  $('saveBtn').classList.add('hidden');
  $('cancelBtn').classList.add('hidden');
  $('deleteBtn').classList.add('hidden');
  try {
    var bmRes = await fetch(API + '/bookmarks?path=' + encodeURIComponent(folderPath));
    var bmData = await bmRes.json();
    currentBookmarks = bmData.bookmarks || [];
    var indexRes = await fetch(API + '/content/' + folderPath + '/index.md');
    if (indexRes.ok) {
      // index.md exists → show as default index
      var data = await indexRes.json();
      content.className = 'content-area markdown';
      content.innerHTML = data.html;
      if (window.Prism) Prism.highlightAllUnder(content);
      renderMermaid(content);
      // Show entry-list toggle button
      var btn = $('bookmarkBtn');
      btn.classList.remove('hidden');
      btn.textContent = currentBookmarks.length > 0 ? '\uD83D\uDCCB ' + currentBookmarks.length : '\uD83D\uDCCB \u4E00\u89A7';
      btn.onclick = function() { showFolderList(folderPath); };
      $('viewToggleBtn').classList.remove('hidden');
      $('viewToggleBtn').textContent = fvViewMode === 'list' ? '\u2630' : '\u229E';
    } else {
      await showFolderList(folderPath);
    }
  } catch {
    currentBookmarks = [];
    await showFolderList(folderPath);
  }
}

async function showFolderList(folderPath) {
  state.currentPath = folderPath;
  state.currentFolder = folderPath;
  state.currentType = 'directory';
  $('bookmarkBtn').classList.add('hidden');
  $('viewToggleBtn').classList.remove('hidden');
  $('viewToggleBtn').textContent = fvViewMode === 'list' ? '\u2630' : '\u229E';
  try {
    var [bmRes, treeRes] = await Promise.all([
      fetch(API + '/bookmarks?path=' + encodeURIComponent(folderPath)),
      fetch(API + '/tree?path=' + encodeURIComponent(folderPath)),
    ]);
    var bmData = await bmRes.json();
    currentBookmarks = bmData.bookmarks || [];
    if (treeRes.ok) {
      var treeData = await treeRes.json();
      currentFolderTree = (treeData.children || []).filter(function(e) { return e.name !== '.bookmarks'; });
    } else { currentFolderTree = []; }
    // Check if index.md exists for the toggle back button
    var indexRes = await fetch(API + '/content/' + folderPath + '/index.md');
    renderFolderView(folderPath, indexRes.ok);
  } catch { currentBookmarks = []; currentFolderTree = []; renderFolderView(folderPath, false); }
}

async function showFolderIndex(folderPath) {
  state.currentPath = folderPath;
  state.currentFolder = folderPath;
  state.currentType = 'directory';
  var content = $('content');
  try {
    var [bmRes, indexRes] = await Promise.all([
      fetch(API + '/bookmarks?path=' + encodeURIComponent(folderPath)),
      fetch(API + '/content/' + folderPath + '/index.md'),
    ]);
    var bmData = await bmRes.json();
    currentBookmarks = bmData.bookmarks || [];
    if (indexRes.ok) {
      var data = await indexRes.json();
      content.className = 'content-area markdown';
      content.innerHTML = data.html;
      if (window.Prism) Prism.highlightAllUnder(content);
      renderMermaid(content);
      var btn = $('bookmarkBtn');
      btn.classList.remove('hidden');
      btn.textContent = currentBookmarks.length > 0 ? '\uD83D\uDCCB ' + currentBookmarks.length : '\uD83D\uDCCB \u4E00\u89A7';
      btn.onclick = function() { showFolderList(folderPath); };
      $('viewToggleBtn').classList.remove('hidden');
      $('viewToggleBtn').textContent = fvViewMode === 'list' ? '\u2630' : '\u229E';
    } else {
      await showFolderList(folderPath);
    }
  } catch { await showFolderList(folderPath); }
}

function renderFolderView(folderPath, hasIndex) {
  const content = $('content');
  content.className = 'content-area';
  let html = '<div class="folder-view">';

  if (hasIndex) {
    html += '<div class="folder-view-header" style="display:flex;justify-content:space-between;align-items:center">';
    html += '<span>' + escapeHtml(folderPath) + '</span>';
    html += '<button class="fv-btn" onclick="showFolderIndex(\'' + escapeHtml(folderPath) + '\')" style="font-size:12px">📄 インデックスを表示</button>';
    html += '</div>';
  } else {
    html += '<div class="folder-view-header">' + escapeHtml(folderPath) + '</div>';
  }

  if (fvViewMode === 'list') {
    // --- List mode: files first, then bookmarks ---
    if (currentFolderTree.length > 0) {
      html += '<div class="fv-files-header">📁 ' + currentFolderTree.length + ' アイテム</div>';
      html += '<div class="fv-file-list">';
      var sorted = currentFolderTree.concat().sort(function(a, b) {
        if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
      sorted.forEach(function(e) {
        var icon = e.type === 'directory' ? '\ud83d\udcc1' : (e.name.endsWith('.md') ? '\ud83d\udcdd' : '\ud83d\udcc4');
        var click = e.type === 'directory'
          ? 'onclick="selectFolder(\'' + e.path + '\')"'
          : 'onclick="selectTreeFile(\'' + e.path + '\')"';
        html += '<div class="fv-file-item" ' + click + '>';
        html += '<span class="fv-file-icon">' + icon + '</span>';
        html += '<span class="fv-file-name">' + escapeHtml(e.name) + '</span>';
        if (e.type === 'directory') html += '<span class="fv-file-suffix">/</span>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div style="border-top:1px solid var(--border);margin:12px 0"></div>';
    }

    html += '<div class="fv-bookmarks-header">';
    html += '<h2>🔖 Bookmarks</h2>';
    html += '<div class="fv-actions">';
    html += '<button class="fv-btn" onclick="showBookmarkAddDialog(\'\')">+ 追加</button>';
    html += '</div></div>';

    if (currentBookmarks.length === 0) {
      html += '<div class="fv-empty">まだブックマークがありません。<br>URLをドロップするか [+ 追加] ボタンから追加してください。</div>';
    } else {
      html += '<div>';
      currentBookmarks.forEach(function(bm, i) {
        var fUrl = bm.domain ? API + '/file/' + folderPath + '/.bookmarks/favicons/' + bm.domain + '.ico' : '';
        var tUrl = bm.thumb ? API + '/file/' + folderPath + '/.bookmarks/thumbs/' + bm.thumb : '';
        html += '<div class="fv-bookmark-item">';
        html += '<a href="' + escapeHtml(bm.url) + '" target="_blank" rel="noopener noreferrer">';
        if (bm.thumb) {
          html += '<img class="fv-list-thumb" src="' + escapeHtml(tUrl) + '" alt="" loading="lazy">';
        } else {
          html += '<img class="fv-favicon" src="' + escapeHtml(fUrl) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
        }
        html += '<span class="fv-title">' + escapeHtml(bm.title) + '</span>';
        html += '<span class="fv-domain">' + escapeHtml(bm.domain) + '</span>';
        html += '</a>';
        html += '<button class="fv-edit-btn" onclick="editBookmark(' + i + ')" title="編集">✎</button>';
        html += '<button class="fv-del-btn" onclick="deleteBookmark(' + i + ')" title="削除">✕</button>';
        html += '</div>';
      });
      html += '</div>';
    }
  } else {
    // --- Thumbnail mode: unified grid of files + bookmarks ---
    html += '<div class="fv-thumb-grid fv-thumb-grid-' + fvViewMode.replace('thumb-', '') + '">';

    var sorted = currentFolderTree.concat().sort(function(a, b) {
      if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    sorted.forEach(function(e) {
      var ext = e.name.split('.').pop().toLowerCase();
      var imgExts = ['png','jpg','jpeg','gif','webp','svg','bmp','ico'];
      var isImage = imgExts.indexOf(ext) !== -1;
      var thumbSrc = isImage ? API + '/file/' + e.path : '';
      var icon = e.type === 'directory' ? '\ud83d\udcc1' : (e.name.endsWith('.md') ? '\ud83d\udcdd' : '\ud83d\udcc4');
      var click = e.type === 'directory'
        ? 'onclick="selectFolder(\'' + e.path + '\')"'
        : 'onclick="selectTreeFile(\'' + e.path + '\')"';
      var tip = e.name;
      if (e.type === 'file') {
        var sz = e.size;
        if (sz !== undefined) {
          tip += ' | ' + (sz > 1048576 ? (sz / 1048576).toFixed(1) + ' MB' : sz > 1024 ? (sz / 1024).toFixed(1) + ' KB' : sz + ' B');
        }
        if (e.mtime) tip += ' | ' + e.mtime.slice(0, 10);
      } else {
        tip += ' | ' + '\u30D5\u30A9\u30EB\u30C0';
      }
      html += '<div class="fv-thumb-card" style="cursor:pointer" title="' + escapeHtml(tip) + '" ' + click + '>';
      if (isImage) {
        html += '<img class="fv-thumb-img" src="' + escapeHtml(thumbSrc) + '" alt="" loading="lazy">';
      } else {
        html += '<div class="fv-thumb-fallback" style="font-size:40px">' + icon + '</div>';
      }
      html += '<div class="fv-thumb-info"><div class="fv-title">' + escapeHtml(e.name) + '</div></div>';
      html += '</div>';
    });

    currentBookmarks.forEach(function(bm, i) {
      var tUrl = bm.thumb ? API + '/file/' + folderPath + '/.bookmarks/thumbs/' + bm.thumb : '';
      var fUrl = bm.domain ? API + '/file/' + folderPath + '/.bookmarks/favicons/' + bm.domain + '.ico' : '';
      html += '<div class="fv-thumb-card">';
      html += '<a href="' + escapeHtml(bm.url) + '" target="_blank" rel="noopener noreferrer">';
      if (bm.thumb) {
        html += '<img class="fv-thumb-img" src="' + escapeHtml(tUrl) + '" alt="" loading="lazy">';
      } else {
        html += '<div class="fv-thumb-fallback">';
        if (fUrl) html += '<img class="fv-favicon" src="' + escapeHtml(fUrl) + '" alt="" loading="lazy" onerror="this.parentElement.textContent=\'?\';this.remove()">';
        else html += '?';
        html += '</div>';
      }
      html += '<div class="fv-thumb-info"><div class="fv-title">' + escapeHtml(bm.title) + '</div><div class="fv-domain">' + escapeHtml(bm.domain) + '</div></div></a>';
      html += '<button class="fv-edit-btn" onclick="editBookmark(' + i + ')" title="編集">✎</button>';
      html += '<button class="fv-del-btn" onclick="deleteBookmark(' + i + ')" title="削除">✕</button>';
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="fv-bookmarks-header" style="margin-top:0">';
    html += '<div></div><div class="fv-actions">';
    html += '<button class="fv-btn" onclick="showBookmarkAddDialog(\'\')">+ 追加</button>';
    html += '</div></div>';
  }

  html += '<div class="fv-dropzone">📥 URLをドロップしてブックマーク追加</div>';
  html += '</div>';
  content.innerHTML = html;
}

function selectFolder(folderPath) {
  var div = findTreeElement(folderPath);
  if (div) {
    var li = div.closest('li');
    if (li) { toggleDir(li, div); }
  }
  state.currentFolder = folderPath;
  state.currentPath = folderPath;
  state.currentType = 'directory';
  if (selectedLi) selectedLi.classList.remove('active');
  selectedLi = null;
  updateUrl(folderPath);
  showFolderView(folderPath);
}

function selectTreeFile(filePath) {
  var div = findTreeElement(filePath);
  if (div) {
    selectFile(filePath, div, filePath.split('/').pop());
  } else {
    state.currentPath = filePath;
    state.currentType = 'file';
    state.currentFolder = getFolderPath(filePath) || state.currentFolder;
    var name = filePath.split('/').pop();
    updateUrl(filePath);
    loadContent(filePath, name);
    checkBookmarks();
  }
}

var fvSizeNames = { 'list': '\u4E00\u89A7', 'thumb-sm': '\u5C0F', 'thumb-md': '\u4E2D', 'thumb-lg': '\u5927' };

function toggleFvView() {
  var sizes = ['list', 'thumb-sm', 'thumb-md', 'thumb-lg'];
  var idx = sizes.indexOf(fvViewMode);
  fvViewMode = sizes[(idx + 1) % sizes.length];
  var btn = $('viewToggleBtn');
  if (btn) btn.textContent = fvViewMode === 'list' ? '\u2630' : '\u229E';
  toast('\u8868\u793A: ' + fvSizeNames[fvViewMode]);
  if (state.currentFolder) renderFolderView(state.currentFolder);
}

function deleteBookmark(idx) {
  var bm = currentBookmarks[idx];
  if (!bm || !confirm('「' + bm.title + '」をブックマークから削除しますか？')) return;
  var folder = state.currentFolder;
  if (!folder) return;
  fetch(API + '/bookmarks', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: folder, url: bm.url }),
  }).then(function(r) { return r.json(); }).then(function() {
    toast('削除しました');
    if (state.currentType === 'directory' || !state.currentPath) {
      showFolderList(folder);
    } else {
      loadContent(state.currentPath, state.currentPath.split('/').pop());
    }
  }).catch(function(e) { toast('削除エラー: ' + e.message); });
}

function editBookmark(idx) {
  var bm = currentBookmarks[idx];
  if (!bm) return;
  var folder = state.currentFolder;
  if (!folder) return;
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-dialog-sm">' +
    '<div class="modal-header">ブックマーク編集</div>' +
    '<div class="modal-body">' +
    '<div class="mb-1"><label>タイトル</label><input class="form-control" id="bmEditTitle" value="' + escapeHtml(bm.title) + '"></div>' +
    '<div class="mb-1"><label>URL</label><input class="form-control" id="bmEditUrl" value="' + escapeHtml(bm.url) + '"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="cool-btn" id="bmEditSave">保存</button>' +
    '<button class="cool-btn" id="bmEditCancel">キャンセル</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#bmEditSave').onclick = async function() {
    var newTitle = overlay.querySelector('#bmEditTitle').value.trim();
    var newUrl = overlay.querySelector('#bmEditUrl').value.trim();
    if (!newTitle || !newUrl) { toast('タイトルとURLを入力してください'); return; }
    try {
      var res = await fetch(API + '/bookmarks', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: folder, oldUrl: bm.url, newTitle: newTitle, newUrl: newUrl }),
      });
      if (!res.ok) { var d = await res.json(); throw new Error(d.error); }
      toast('更新しました');
      overlay.remove();
      if (state.currentType === 'directory' || !state.currentPath) {
        showFolderList(folder);
      } else {
        loadContent(state.currentPath, state.currentPath.split('/').pop());
      }
    } catch (e) { toast('更新エラー: ' + e.message); }
  };
  overlay.querySelector('#bmEditCancel').onclick = function() { overlay.remove(); };
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

let fvDragCounter = 0;

function checkBookmarks() {
  // Called when viewing a file – show entry-list button if folder has bookmarks
  var folder = state.currentFolder;
  var btn = $('bookmarkBtn');
  if (!folder || !btn) { if (btn) btn.classList.add('hidden'); return; }
  fetch(API + '/bookmarks?path=' + encodeURIComponent(folder))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var bms = data.bookmarks || [];
      if (bms.length > 0) {
        currentBookmarks = bms;
        btn.classList.remove('hidden');
        btn.textContent = '\uD83D\uDCCB ' + bms.length;
        btn.onclick = function() { toggleBookmarkView(); };
      } else {
        btn.classList.add('hidden');
      }
    }).catch(function() { btn.classList.add('hidden'); });
}

function toggleBookmarkView() {
  // Called from toolbar button when viewing a file
  // Navigate to the folder's entry list
  var folder = state.currentFolder;
  if (folder) {
    updateUrl(folder);
    showFolderList(folder);
  }
}

function initFolderDnD() {
  var content = $('content');
  content.addEventListener('dragenter', function(e) {
    if (!state.currentFolder) return;
    e.preventDefault(); fvDragCounter++; content.classList.add('fv-dragover');
  });
  content.addEventListener('dragleave', function(e) {
    if (!state.currentFolder) return;
    e.preventDefault(); fvDragCounter--;
    if (fvDragCounter <= 0) { fvDragCounter = 0; content.classList.remove('fv-dragover'); }
  });
  content.addEventListener('dragover', function(e) {
    if (!state.currentFolder) return;
    e.preventDefault();
  });
  content.addEventListener('drop', async function(e) {
    if (!state.currentFolder) return;
    e.preventDefault();
    fvDragCounter = 0;
    content.classList.remove('fv-dragover');
    var url = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (!url) { toast('URLを認識できませんでした'); return; }
    var cleanUrl = url.trim();
    if (cleanUrl.startsWith('<') && cleanUrl.endsWith('>')) cleanUrl = cleanUrl.slice(1, -1);
    if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) { toast('有効なURLではありません'); return; }
    showBookmarkAddDialog(cleanUrl);
  });
}

function showBookmarkAddDialog(url) {
  var folder = state.currentFolder;
  if (!folder) { toast('先にフォルダを選択してください'); return; }
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-dialog-sm">' +
    '<div class="modal-header">🔖 ブックマーク追加</div>' +
    '<div class="modal-body">' +
    '<div class="mb-1"><label>タイトル</label><input class="form-control" id="bmAddTitle" placeholder="ページタイトル"></div>' +
    '<div class="mb-1"><label>URL</label><input class="form-control" id="bmAddUrl" value="' + escapeHtml(url) + '"></div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="cool-btn" id="bmAddSave">追加</button>' +
    '<button class="cool-btn" id="bmAddCancel">キャンセル</button>' +
    '</div></div>';
  document.body.appendChild(overlay);
  var urlInput = overlay.querySelector('#bmAddUrl');
  var titleInput = overlay.querySelector('#bmAddTitle');
  try { titleInput.value = new URL(url).hostname; } catch (e) {}
  if (url) {
    fetch(API + '/page-title?url=' + encodeURIComponent(url))
      .then(function(r) { return r.json(); })
      .then(function(data) { if (data.title) titleInput.value = data.title; })
      .catch(function() {});
  }
  overlay.querySelector('#bmAddSave').onclick = async function() {
    var title = titleInput.value.trim();
    var u = urlInput.value.trim();
    if (!title || !u) { toast('タイトルとURLを入力してください'); return; }
    try {
      var res = await fetch(API + '/bookmarks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ path: folder, title: title, url: u }),
      });
      if (!res.ok) { var d = await res.json(); throw new Error(d.error); }
      toast('追加しました');
      overlay.remove();
      var refreshView = function() {
        if (state.currentType === 'directory' || !state.currentPath) {
          showFolderList(folder);
        } else {
          loadContent(state.currentPath, state.currentPath.split('/').pop());
        }
      };
      refreshView();
      // Poll for async thumbnail fetch (up to 20s)
      var pollElapsed = 0;
      var pollTimer = setInterval(function() {
        pollElapsed += 3000;
        fetch(API + '/bookmarks?path=' + encodeURIComponent(folder))
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var bm = (data.bookmarks || []).find(function(b) { return b.url === u; });
            if (bm && bm.thumb) {
              clearInterval(pollTimer);
              if (state.currentFolder === folder) refreshView();
            }
          }).catch(function() {});
        if (pollElapsed >= 20000) clearInterval(pollTimer);
      }, 3000);
    } catch (e) { toast('追加エラー: ' + e.message); }
  };
  overlay.querySelector('#bmAddCancel').onclick = function() { overlay.remove(); };
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
}

(async () => {
  initFolderDnD();
  await refreshTree();
  const urlPath = getPathFromUrl();
  if (urlPath) {
    await navigateByPath(urlPath);
  } else {
    $('content').innerHTML = `<div class="empty-state"><h2>Wiki</h2><p>サイドバーからファイルを選択してください</p></div>`;
    updateUrl(null, true);
  }
})();
</script>
</body>
</html>
